<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- img-src 放开 https：笔记里的外链图片要能显示（default-src 'self' 会拦掉 https 图片） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: todo-media:; script-src 'self';" />
  <title>Knodo</title>
  <!-- 第三方依赖：flatpickr（日期范围选择）、tom-select（分组多选）。先加载厂商样式，再用本项目样式覆盖主题 -->
  <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css" />
  <link rel="stylesheet" href="vendor/tom-select/tom-select.min.css" />
  <link rel="stylesheet" href="vendor/easymde/easymde.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <!-- Knodo 标识（与 assets/knodo.svg 同一套几何）：环 = 知识回路，K = 清单竖条 + 斜臂，圆环上 3 个节点 = 知识关联 -->
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 256 256">
            <defs>
              <linearGradient id="knodoMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2E5BFF" />
                <stop offset="0.5" stop-color="#2450E8" />
                <stop offset="1" stop-color="#16C8E8" />
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="60.16" fill="url(#knodoMark)" />
            <g fill="#fff" stroke="#fff" stroke-linecap="round">
              <circle cx="128" cy="128" r="101.12" fill="none" stroke-width="13.82" />
              <line x1="72.96" y1="60.16" x2="72.96" y2="195.84" stroke-width="23.55" />
              <line x1="72.96" y1="128" x2="157.69" y2="61.8" stroke-width="24.58" />
              <line x1="72.96" y1="128" x2="157.69" y2="194.2" stroke-width="24.58" />
              <line x1="157.69" y1="61.8" x2="207.68" y2="65.74" stroke-width="7.17" opacity="0.85" />
              <line x1="157.69" y1="194.2" x2="207.68" y2="190.26" stroke-width="7.17" opacity="0.85" />
              <circle cx="207.68" cy="65.74" r="14.08" stroke="none" />
              <circle cx="229.12" cy="128" r="14.08" stroke="none" />
              <circle cx="207.68" cy="190.26" r="14.08" stroke="none" />
            </g>
          </svg>
        </span>
        <span class="brand-name" title="Knodo — 知识化待办（Knowledge + Todo）">Knodo</span>
      </div>

      <nav class="nav">
        <button class="nav-item" data-view="today"><span class="nav-ico">📅</span>今天</button>
        <button class="nav-item" data-view="upcoming"><span class="nav-ico">⏰</span>即将到期</button>
        <button class="nav-item" data-view="all"><span class="nav-ico">📋</span>全部任务</button>
        <button class="nav-item" data-view="completed"><span class="nav-ico">✅</span>已完成</button>
        <button class="nav-item" data-view="archived"><span class="nav-ico">🗂</span>归档</button>
        <button class="nav-item" data-view="notes"><span class="nav-ico">📝</span>笔记</button>
        <button class="nav-item" data-view="stats"><span class="nav-ico">📊</span>统计</button>
        <button class="nav-item" data-view="reports"><span class="nav-ico">🤖</span>AI 报告</button>
        <button class="nav-item" data-view="search"><span class="nav-ico">🔍</span>AI 检索</button>
        <button class="nav-item" data-view="meetings"><span class="nav-ico">🎙</span>会议纪要</button>
      </nav>

      <div class="sidebar-section">
        <div class="section-head">
          <span>分组</span>
          <button class="mini-btn" id="btn-add-group" title="新增分组">＋</button>
        </div>
        <ul class="group-list" id="group-list"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-head">
          <span>标签</span>
          <button class="mini-btn" id="btn-add-tag" title="新增标签">＋</button>
        </div>
        <ul class="tag-list" id="tag-list"></ul>
      </div>
    </aside>

    <!-- 侧边栏与主区之间的拖拽把手：拖动调整侧边栏宽度（双击恢复默认） -->
    <div class="sidebar-resizer" id="sidebar-resizer" title="拖拽调整侧边栏宽度（双击恢复默认）"
         role="separator" aria-orientation="vertical" aria-label="调整侧边栏宽度"></div>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="view-title">今天</h1>
          <span class="view-desc" id="view-desc"></span>
        </div>
        <div class="topbar-right">
          <!-- 搜索框 + 笔记入口：顶栏在 1080 宽下已经排满（按钮加起来 788 / 可用 790），
               所以笔记做成搜索框右侧的附件而不是并排新按钮 —— 位置就在「搜索栏旁」，
               又不把「＋ 新建任务」挤到第二行。点开是完整笔记界面（弹窗），不切换视图。 -->
          <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索任务 / 标签…" />
            <button type="button" class="search-action" id="btn-notes-dock"
                    title="打开笔记（弹窗，内容与侧栏「笔记」完全一致，不离开当前任务）"
                    aria-label="打开笔记">📝</button>
          </div>
          <button class="text-btn" id="btn-sync" title="导出任务 / 笔记到腾讯文档、ima 等其它产品">☁ 同步</button>
          <button class="text-btn" id="btn-import" title="从完整备份包（.zip）或旧版 JSON 恢复">📥 导入</button>
          <button class="text-btn" id="btn-export" title="导出完整备份包（任务 / 笔记 / 附件 / 录音都在里面）">📤 备份</button>
          <button class="text-btn" id="btn-archive-done" title="归档已完成任务">🗂 归档</button>
          <button class="text-btn" id="btn-record" title="录制会议音频（或屏幕），结束后转文字并生成纪要">⏺ 录制</button>
          <!-- AI 设置 / 开机自启动 已移到顶部菜单栏（主进程应用菜单） -->
          <button class="text-btn" id="btn-theme" title="切换主题">🌓 主题</button>
          <button class="primary-btn" id="btn-new-task">＋ 新建任务</button>
        </div>
      </header>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-label">优先级</span>
        <button class="chip" data-priority="all">全部</button>
        <button class="chip" data-priority="0">低</button>
        <button class="chip" data-priority="1">中</button>
        <button class="chip" data-priority="2">高</button>
        <button class="chip" data-priority="3">紧急</button>
        <span class="filter-sep"></span>
        <button class="chip" id="btn-time-filter">⏱ 时间筛选</button>
        <span class="filter-sep"></span>
        <button class="chip chip-tag" id="tag-filter-chip" hidden title="点击清除标签筛选"></button>
        <span class="filter-sep"></span>
        <span class="filter-label">排序</span>
        <select class="sort-select" id="sort-select" title="选择列表排序方式；选「手动」后可直接拖拽任务行调整顺序">
          <option value="smart">智能</option>
          <option value="priority">优先级</option>
          <option value="due">截止日期</option>
          <option value="manual">手动（可拖拽）</option>
        </select>
      </div>

      <!-- 时间筛选面板：内容由 ui.js 的 buildTimeFilter() 用 flatpickr 范围控件生成，
           与「添加任务」里的日期选择器保持同一套交互与样式 -->
      <div class="time-filter" id="time-filter" hidden></div>

      <!-- 视图容器（任务列表 + 底部就地新增/编辑） -->
      <div class="view" id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 任务详情抽屉 -->
  <div class="detail-drawer" id="detail-drawer" hidden></div>

  <!-- 经典脚本先于 ES module 执行（module 默认 defer），因此 app.js 里 window.flatpickr 已就绪 -->
  <script src="vendor/flatpickr/flatpickr.min.js"></script>
  <script src="vendor/flatpickr/l10n-zh.js"></script>
  <script src="vendor/tom-select/tom-select.complete.min.js"></script>
  <script src="vendor/markdown-it/markdown-it.min.js"></script>
  <!-- 代码高亮（highlight.js）：markdown-it 的 highlight 钩子是同步的，必须随页面一起就绪。
       mermaid 体积大且多数笔记用不到，走运行时动态 import（见 renderer/vendor/mermaid/mermaid.mjs） -->
  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/easymde/easymde.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
