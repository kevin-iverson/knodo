<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- img-src 放开 https：笔记里的外链图片要能显示（default-src 'self' 会拦掉 https 图片） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: todo-media:; script-src 'self';" />
  <title>Knodo</title>
  <!-- 外观：必须在样式之前同步把 data-theme / data-style / token 三元组写进 :root，
       否则深色 / 石墨用户每次启动都会先闪一帧雾灰浅色（module 脚本是 defer 的，来不及）。 -->
  <script src="js/theme-core.js"></script>
  <!-- 第三方依赖：flatpickr（日期范围选择）、tom-select（分组多选）。先加载厂商样式，再用本项目样式覆盖主题 -->
  <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css" />
  <link rel="stylesheet" href="vendor/tom-select/tom-select.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- 外观设置（风格卡 / 背景图 / 透明度）专用样式，只挂在设置中心「外观」分区与背景层上 -->
  <link rel="stylesheet" href="css/appearance.css" />
  <!-- 所见即所得两态样式：加载在 styles.css 之后，覆盖旧的「预览 / 分栏 / 源码」三态规则 -->
  <link rel="stylesheet" href="css/wysiwyg.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/encourager.css" />
  <link rel="stylesheet" href="css/recurrence.css" />
</head>
<body>
  <!-- 背景层：L1 图片 + L2 scrim（内容全在 .app 里，z-index 压在它上面）。
       恒定满不透明；滑块调的是「它透过面板的比例」= --surface-alpha。 -->
  <div id="app-backdrop" aria-hidden="true" hidden>
    <div class="bd-image"></div>
    <div class="bd-scrim"></div>
  </div>

  <!-- 应用外壳：上面一条自绘标题栏，下面才是原本的 侧栏 + 主区。
       窗口是 titleBarStyle:"hidden" 且不挂 overlay —— 系统标题栏、菜单栏、窗口三键
       全部不画，三键由 .tb-win 自绘（见下方的图标与 titlebar 注释）。
       .titlebar 的高度必须等于 main/theme.js 的 TITLEBAR_HEIGHT(50)。 -->
  <div class="app-shell">
    <!-- 整条都是拖拽区：按住空白处可拖窗，双击标题栏 = 最大化 / 还原（系统按 caption 处理） -->
    <header class="titlebar">
      <!-- Knodo 标识「一笔两色」：朱砂短臂 = 待办，象牙长臂 = 知识，拐点圆点 = 节点 -->
      <span class="tb-logo" aria-hidden="true">
        <svg viewBox="0 0 256 256">
          <defs>
            <linearGradient id="knodoMarkTitle" x1="0" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#1E1A16" />
              <stop offset="1" stop-color="#0F0C0A" />
            </linearGradient>
          </defs>
          <rect width="256" height="256" rx="56" fill="url(#knodoMarkTitle)" />
          <path d="M72 138 L110 175 L184 81" fill="none" stroke="#FFFBF0" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M72 138 L110 175" fill="none" stroke="#D9472E" stroke-width="31" stroke-linecap="round" />
          <circle cx="110" cy="175" r="17" fill="#D9472E" />
        </svg>
      </span>
      <span class="tb-name" title="Knodo — 知识化待办（Knowledge + Todo）">Knodo</span>
      <!-- 版本号跟着品牌名（只是弱提示，取不到就空着，不影响布局） -->
      <span class="tb-ver" id="sb-ver"></span>
      <!-- 设置入口：骑在标题栏「侧栏段 / 主区段」分界线上的齿轮（另有 Ctrl+, 与托盘菜单两条路）。
           位置由 CSS 按 --sidebar-width 算，拖动侧栏宽度它会跟着走；
           标题栏整条是 drag 区，按钮必须 no-drag，否则点不动只会拖窗。 -->
      <button type="button" class="tb-set" id="btn-settings" title="设置（Ctrl+,）" aria-label="打开设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <!-- 标题栏主区段左端的快捷入口组：日历 + 统计 + 工时 + 搭子（顺序就是视觉顺序）。
           .tb-nav 只负责定位与间距，按钮自带尺寸 —— 再加一个入口时不用重算绝对偏移。
           日历 / 统计：从侧栏搬来，保留 .nav-item 类与 data-view ——
           点击切换、active 高亮、视图重绘全都复用既有逻辑。 -->
      <div class="tb-nav" role="group" aria-label="快捷入口">
        <button type="button" class="nav-item tb-cal" data-view="calendar"
                title="日历视图：月 / 周负载总览（Ctrl+Alt+M）"><span class="nav-ico">🗓</span>日历</button>
        <!-- 统计：用户指定夹在日历与搭子中间（原先在侧栏底部） -->
        <button type="button" class="nav-item tb-stats" data-view="stats"
                title="统计视图：任务完成情况概览（按分组 / 标签 / 优先级看欠账与产出）"><span class="nav-ico">📊</span>统计</button>
        <!-- 工时：用户要求放在「统计」右侧，且不再标「插件」角标。
             入口**常驻**（不随功能开关出现 / 消失）—— 功能关闭时点进来是「未启用」引导页，
             否则用户既看不到入口、也无从知道该去哪儿开启（见 ui.js#renderWorklogOff）。 -->
        <button type="button" class="nav-item tb-worklog" data-view="worklog"
                title="工时：子任务向上累积，可按分组 / 标签筛选后导出报工表"><span class="nav-ico">🕒</span>工时</button>
        <!-- 搭子：工位搭子面板（五页签主浮窗的「搭子」页）。
             它不是视图，所以不挂 .nav-item / data-view —— 点击只开模态，不切 state.view。 -->
        <button type="button" class="tb-buddy" id="btn-buddy"
                title="搭子：工位搭子（戳一戳 / 抽签 / 抱团 / 牛马卡，Ctrl+Alt+E）"
                aria-label="打开工位搭子"><span class="nav-ico">🐮</span>搭子</button>
      </div>
      <!-- 明暗滑块：一枚「日 / 月 盘」，落在主区段右端的空位（窗口三键左侧 37px）。
           视觉两态只由 :root[data-theme] 驱动 —— 首帧就是对的，不靠 JS 补；
           JS 只负责点击 / ←→ 改 mode 与 aria-checked，「跟随系统」仍留在设置中心。
           标题栏整条是 drag 区，所以它必须 no-drag（见 styles.css 的 .tb-mode）。 -->
      <button type="button" class="tb-mode" id="btn-theme-mode" role="switch"
              aria-checked="false" aria-label="深色主题" title="切换明暗主题">
        <span class="tbm-track" aria-hidden="true">
          <span class="tbm-orb">
            <!-- 两枚字形都常驻 DOM，靠透明度 / 旋转互换：太阳是实心圆盘 + 八道短线，
                 月亮是实心月牙。都做「剪影」不做描边 —— 13px 下描边会糊成一团。 -->
            <svg class="tbm-ico tbm-sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.3" fill="currentColor" />
              <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none">
                <path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
              </g>
            </svg>
            <svg class="tbm-ico tbm-moon" viewBox="0 0 24 24">
              <path d="M21 12.9A9 9 0 1 1 11.1 3a7.1 7.1 0 0 0 9.9 9.9z" fill="currentColor" />
            </svg>
          </span>
        </span>
      </button>
      <!-- 窗口控制三键：自绘（系统 overlay 已撤，见 main/main.js 的注释）。
           46×40 是 Windows 的惯例尺寸；图标是 10px 细线 SVG，跟 currentColor 走，
           所以换主题 / 换风格不用重新推一次原生配色。最大化↔还原由 js/win-controls.js 切换。 -->
      <div class="tb-win" id="tb-win" role="group" aria-label="窗口控制">
        <button type="button" class="tb-win-btn" data-win="min" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.5h7" /></svg>
        </button>
        <button type="button" class="tb-win-btn" data-win="max" title="最大化" aria-label="最大化">
          <svg class="ico-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.6" y="1.6" width="6.8" height="6.8" rx="0.8" /></svg>
          <svg class="ico-restore" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1.4" y="3.1" width="5.5" height="5.5" rx="0.8" />
            <path d="M3.4 3.1V1.6h5v5H6.9" />
          </svg>
        </button>
        <button type="button" class="tb-win-btn is-close" data-win="close" title="关闭（最小化到托盘）" aria-label="关闭">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
        </button>
      </div>
    </header>

    <div class="app">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <!-- 侧栏不再放品牌块：窗口标题栏已有图标 + 标题，再来一个 logo 就是两个。
             导航 / 分组 / 标签放进独立滚动容器，底部只留版本号。 -->
        <div class="sidebar-scroll">
          <nav class="nav">
            <button class="nav-item" data-view="today"><span class="nav-ico">📅</span>今天</button>
            <button class="nav-item" data-view="upcoming"><span class="nav-ico">⏰</span>即将到期</button>
            <!-- 「未完成」= 全部进行中任务，跨分组汇总（含逾期 / 未排期）。
                 放在「即将到期」与「全部任务」之间：一个看将来，一个看欠账，再往下才是全量。 -->
            <button class="nav-item" data-view="unfinished"><span class="nav-ico">📇</span>未完成</button>
            <button class="nav-item" data-view="all"><span class="nav-ico">📋</span>全部任务</button>
            <button class="nav-item" data-view="completed"><span class="nav-ico">✅</span>已完成</button>
            <button class="nav-item" data-view="archived"><span class="nav-ico">🗂</span>归档</button>
            <button class="nav-item" data-view="notes"><span class="nav-ico">📝</span>笔记</button>
            <button class="nav-item" data-view="reports"><span class="nav-ico">🤖</span>AI 报告</button>
            <button class="nav-item" data-view="meetings"><span class="nav-ico">🎙</span>会议纪要</button>
          </nav>

          <div class="sidebar-section">
            <div class="section-head">
              <span>分组</span>
              <button class="mini-btn" id="btn-add-group" title="新增分组">＋</button>
            </div>
            <ul class="group-list" id="group-list"></ul>
          </div>

          <div class="sidebar-section">
            <div class="section-head">
              <span>标签</span>
              <button class="mini-btn" id="btn-add-tag" title="新增标签">＋</button>
            </div>
            <ul class="tag-list" id="tag-list"></ul>
          </div>
        </div>
      </aside>

      <!-- 侧边栏与主区之间的拖拽把手：拖动调整侧边栏宽度（双击恢复默认） -->
      <div class="sidebar-resizer" id="sidebar-resizer" title="拖拽调整侧边栏宽度（双击恢复默认）"
           role="separator" aria-orientation="vertical" aria-label="调整侧边栏宽度"></div>

      <!-- 主区域 -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h1 id="view-title">今天</h1>
            <span class="view-desc" id="view-desc"></span>
          </div>
          <div class="topbar-right">
            <!-- 搜索框 + AI 检索 + 笔记按钮：普通关键词过滤留在输入框，AI 检索是独立视图，
                 两个入口都紧贴搜索框（原侧栏「AI 检索」已上移）；笔记点开是弹窗，不切视图。
                 「同步」「主题」两个低频入口已收进顶部菜单栏，腾出的行宽给这里。 -->
            <div class="search-box">
              <input type="text" id="search-input" placeholder="搜索任务 / 标签…" />
            </div>
            <button type="button" class="text-btn ai-search-btn" id="btn-ai-search"
                    title="AI 检索：关键词检索全部任务并生成 AI 总结（再点一次返回任务列表）">🔍 AI 检索</button>
            <button type="button" class="text-btn note-btn" id="btn-notes-dock"
                    title="打开笔记（弹窗，内容与侧栏「笔记」完全一致，不离开当前任务）">📝 笔记</button>
            <!-- 贴顶便签（📌）不再占顶栏位置：紧挨「笔记」看起来像笔记的附属按钮，
                 而且它是低频开关、常驻图标只是噪音。入口保留在侧栏「未完成」的右键菜单里。 -->
            <button class="text-btn" id="btn-import" title="从完整备份包（.zip）或旧版 JSON 恢复">📥 导入</button>
            <button class="text-btn" id="btn-export" title="导出完整备份包（任务 / 笔记 / 附件 / 录音都在里面）">📤 备份</button>
            <!-- 「🗂 归档」已移入 File 菜单（低频维护动作），腾出的行宽给搜索框与 AI 检索 -->
            <button class="text-btn" id="btn-record" title="录制会议音频（或屏幕），结束后转文字并生成纪要">⏺ 录制</button>
            <!-- AI 设置 / 开机自启动 / 同步 / 主题 都在顶部菜单栏（主进程应用菜单） -->
            <button class="primary-btn" id="btn-new-task">＋ 新建任务</button>
          </div>
        </header>

        <div class="filter-bar" id="filter-bar">
          <span class="filter-label">优先级</span>
          <button class="chip" data-priority="all">全部</button>
          <button class="chip" data-priority="0">低</button>
          <button class="chip" data-priority="1">中</button>
          <button class="chip" data-priority="2">高</button>
          <button class="chip" data-priority="3">紧急</button>
          <span class="filter-sep"></span>
          <button class="chip" id="btn-time-filter">⏱ 时间筛选</button>
          <span class="filter-sep"></span>
          <button class="chip chip-tag" id="tag-filter-chip" hidden title="点击清除标签筛选"></button>
          <span class="filter-sep"></span>
          <span class="filter-label">排序</span>
          <select class="sort-select" id="sort-select" title="选择列表排序方式；选「手动」后可直接拖拽任务行调整顺序">
            <option value="smart">智能</option>
            <option value="priority">优先级</option>
            <option value="due">截止日期</option>
            <option value="manual">手动（可拖拽）</option>
          </select>
        </div>

        <!-- 时间筛选面板：内容由 ui.js 的 buildTimeFilter() 用 flatpickr 范围控件生成，
             与「添加任务」里的日期选择器保持同一套交互与样式 -->
        <div class="time-filter" id="time-filter" hidden></div>

        <!-- 视图容器：任务列表 + 末尾的就地新增 / 编辑（新建框长在最后一条任务下面） -->
        <div class="view" id="view"></div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 背景图文件丢失的提示条：不阻塞启动，也不弹模态，点「重新选择」直接落到外观分区 -->
  <div class="bd-lost" id="bd-lost" hidden>
    <span class="bd-lost-text">⚠ 背景图文件已丢失，已回退主题底色</span>
    <button type="button" class="bd-lost-btn" id="bd-lost-fix">重新选择</button>
    <button type="button" class="bd-lost-x" id="bd-lost-close" aria-label="关闭提示">×</button>
  </div>

  <!-- 任务详情抽屉 -->
  <div class="detail-drawer" id="detail-drawer" hidden></div>

  <!-- 经典脚本先于 ES module 执行（module 默认 defer），因此 app.js 里 window.flatpickr 已就绪 -->
  <script src="vendor/flatpickr/flatpickr.min.js"></script>
  <script src="vendor/flatpickr/l10n-zh.js"></script>
  <script src="vendor/tom-select/tom-select.complete.min.js"></script>
  <script src="vendor/markdown-it/markdown-it.min.js"></script>
  <!-- 代码高亮（highlight.js）：markdown-it 的 highlight 钩子是同步的，必须随页面一起就绪。
       mermaid 体积大且多数笔记用不到，走运行时动态 import（见 renderer/vendor/mermaid/mermaid.mjs） -->
  <script src="vendor/highlight/highlight.min.js"></script>
  <!-- HTML → Markdown 序列化（所见即所得编辑器保存正文时用），UMD 单文件随仓库 vendor，离线可用。
       升级来源见 package.json devDependencies：turndown / turndown-plugin-gfm。 -->
  <script src="vendor/turndown/turndown.js"></script>
  <script src="vendor/turndown/turndown-plugin-gfm.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
